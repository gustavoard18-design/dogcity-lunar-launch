<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DogCity Lunar Launch moved</title>
  <link rel="canonical" href="https://dogcity-lunar-launch.vercel.app/" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#05050f" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, #0c2150, #030816 70%); color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .card { width: 100%; max-width: 420px; text-align: center; background: rgba(8, 18, 42, 0.92); border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 18px; padding: 24px 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
    img { width: 84px; height: 84px; border-radius: 50%; border: 2px solid rgba(125, 211, 252, 0.6); }
    h1 { font-size: 20px; margin: 12px 0 6px; color: #fff; }
    p { font-size: 14px; line-height: 1.5; margin: 0 0 14px; color: #cbd5e1; }
    .url { font-family: ui-monospace, monospace; color: #fcd34d; word-break: break-all; }
    a.btn, button.btn { display: block; width: 100%; padding: 13px 14px; margin-top: 10px; border-radius: 14px; border: 0; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; }
    .primary { background: linear-gradient(100deg, #ea580c, #f97316 45%, #f59e0b); color: #fff; }
    .ghost { background: rgba(14, 30, 64, 0.7); color: #cbd5e1; border: 1px solid rgba(56, 189, 248, 0.3) !important; }
    .small { font-size: 12px; color: #94a3b8; margin-top: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <img src="https://dogcity-lunar-launch.vercel.app/dog-face.png" alt="" />
    <h1 id="title">DogCity moved!</h1>
    <p id="text">The game now lives at</p>
    <p class="url">dogcity-lunar-launch.vercel.app</p>
    <div id="withProgress" hidden>
      <button id="carry" class="btn primary">Take my progress</button>
      <a id="skip" class="btn ghost" href="https://dogcity-lunar-launch.vercel.app/">Go without it</a>
      <p class="small" id="note">Your pilot, Stardust and upgrades saved in this browser go with you. Wallets with a verified signature also recover progress from the cloud.</p>
    </div>
    <div id="noProgress" hidden>
      <a id="go" class="btn primary" href="https://dogcity-lunar-launch.vercel.app/">Open the game</a>
    </div>
  </main>
  <script>
    // Página de mudança no endereço antigo (GitHub Pages). Leva os dados do
    // navegador (chaves dogcity_*) para o endereço novo no fragmento do link,
    // que o jogo importa ao abrir (src/lib/transfer.ts).
    (function () {
      var NEW = 'https://dogcity-lunar-launch.vercel.app/';
      var qs = location.search || '';
      var T = {
        en: { title: 'DogCity moved!', text: 'The game now lives at', carry: 'Take my progress', skip: 'Go without it', go: 'Open the game', note: 'Your pilot, Stardust and upgrades saved in this browser go with you. Wallets with a verified signature also recover progress from the cloud.', busy: 'Packing…' },
        pt: { title: 'O DogCity mudou de endereço!', text: 'O jogo agora está em', carry: 'Levar meu progresso', skip: 'Ir sem levar', go: 'Abrir o jogo', note: 'Seu piloto, Stardust e upgrades salvos neste navegador vão junto. Carteiras verificadas também recuperam o progresso pela nuvem.', busy: 'Preparando…' },
        es: { title: '¡DogCity cambió de dirección!', text: 'El juego ahora está en', carry: 'Llevar mi progreso', skip: 'Ir sin llevarlo', go: 'Abrir el juego', note: 'Tu piloto, Stardust y mejoras guardados en este navegador van contigo. Las billeteras verificadas también recuperan el progreso desde la nube.', busy: 'Preparando…' }
      };
      var lang = 'en';
      try { lang = localStorage.getItem('dogcity_lang') || ''; } catch (e) {}
      if (!T[lang]) lang = /^pt/i.test(navigator.language) ? 'pt' : /^es/i.test(navigator.language) ? 'es' : 'en';
      var t = T[lang];
      document.documentElement.lang = lang;
      for (var id in { title: 1, text: 1, carry: 1, skip: 1, go: 1, note: 1 }) document.getElementById(id).textContent = t[id];
      document.getElementById('skip').href = NEW + qs;
      document.getElementById('go').href = NEW + qs;

      var items = {};
      var hasProgress = false;
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (/^dogcity_[a-z0-9_]{1,40}$/.test(k)) items[k] = localStorage.getItem(k);
        }
        var profiles = JSON.parse(items.dogcity_game_state || '{}');
        hasProgress = !!profiles && Object.keys(profiles).length > 0;
      } catch (e) {}

      if (!hasProgress) {
        // Sem nada para levar: vai direto (mantém o ?c= do link de desafio).
        location.replace(NEW + qs);
        document.getElementById('noProgress').hidden = false;
        return;
      }
      document.getElementById('withProgress').hidden = false;

      function b64url(bytes) {
        var s = '';
        for (var j = 0; j < bytes.length; j += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(j, j + 0x8000));
        return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      document.getElementById('carry').onclick = function () {
        var btn = this;
        btn.disabled = true;
        btn.textContent = t.busy;
        var raw = new TextEncoder().encode(JSON.stringify({ v: 1, items: items }));
        var done = function (kind, bytes) { location.href = NEW + qs + '#import=' + kind + '.' + b64url(bytes); };
        if (typeof CompressionStream === 'undefined') return done('p', raw);
        new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()
          .then(function (buf) { done('z', new Uint8Array(buf)); })
          .catch(function () { done('p', raw); });
      };
    })();
  </script>
</body>
</html>
